name: Deploy to Hostinger

# Auto-deploys the static site to Hostinger over FTPS whenever code lands on
# `main` (production) or `staging`. No more manual Redeploy in hPanel.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   FTP_HOST      Hostinger FTP host/IP   (Files -> FTP Accounts)
#   FTP_USERNAME  Hostinger FTP username
#   FTP_PASSWORD  Hostinger FTP password
#
# Deploy targets are defined below. Adjust the staging path if Hostinger created
# the stag.isaacrothsolar.com subdomain in a different folder, or if the FTP
# account is scoped to a subdirectory.

on:
  push:
    branches: [main, staging]

# Never let two deploys for the same branch run at once.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve deploy target
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            # Production document root.
            echo "dir=public_html/" >> "$GITHUB_OUTPUT"
          else
            # Staging subdomain (stag.isaacrothsolar.com) document root.
            echo "dir=domains/stag.isaacrothsolar.com/public_html/" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ${{ steps.target.outputs.dir }}
          # Never upload repo/CI plumbing or touch server-managed files.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .htaccess
            .well-known/**
