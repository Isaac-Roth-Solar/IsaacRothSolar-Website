name: Deploy to Hostinger

# Auto-deploys the static site to Hostinger over FTPS on pushes to `main`
# (production) or `staging`.
#
#   staging -> chrooted FTP account, lands in stag docroot -> upload to "./"
#   prod    -> master account (u496029094), lands in home   -> upload to
#              "domains/isaacrothsolar.com/public_html/" (real apex docroot,
#              confirmed by recon 2026-06-19).
#   NOTE: FTP_*_PROD secrets MUST be set. If empty, the main-branch ternary
#   below silently falls back to the staging creds and prod never updates.
#
# Always overwrites: a reset step deletes the action's sync-state before each
# deploy. Uploads are additive; .well-known is excluded so SSL is untouched.
#
# Required repository secrets:
#   Production: FTP_HOST_PROD     FTP_USERNAME_PROD     FTP_PASSWORD_PROD
#   Staging:    FTP_HOST_STAGING  FTP_USERNAME_STAGING  FTP_PASSWORD_STAGING

on:
  push:
    branches: [main, staging]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ github.ref_name == 'main' && secrets.FTP_HOST_PROD || secrets.FTP_HOST_STAGING }}
      FTP_USER: ${{ github.ref_name == 'main' && secrets.FTP_USERNAME_PROD || secrets.FTP_USERNAME_STAGING }}
      FTP_PASS: ${{ github.ref_name == 'main' && secrets.FTP_PASSWORD_PROD || secrets.FTP_PASSWORD_STAGING }}
      SERVER_DIR: ${{ github.ref_name == 'main' && 'domains/isaacrothsolar.com/public_html/' || './' }}
      STATE_PATH: ${{ github.ref_name == 'main' && 'domains/isaacrothsolar.com/public_html/.ftp-deploy-sync-state.json' || '.ftp-deploy-sync-state.json' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show FTP layout (diagnostic)
        run: |
          echo "Branch: ${{ github.ref_name }}  |  uploading to: $SERVER_DIR"
          for d in "" "public_html/" "domains/" "domains/isaacrothsolar.com/" "domains/isaacrothsolar.com/public_html/"; do
            echo "================ listing: /$d ================"
            curl -s --ssl-reqd -k --connect-timeout 30 -u "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/$d" || true
          done

      - name: Reset deploy state (force full overwrite)
        run: |
          curl --ssl-reqd -k --connect-timeout 30 \
            -u "$FTP_USER:$FTP_PASS" \
            -Q "DELE $STATE_PATH" \
            "ftp://$FTP_HOST/" || true

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ env.FTP_USER }}
          password: ${{ env.FTP_PASS }}
          protocol: ftps
          port: 21
          timeout: 600000
          local-dir: ./
          server-dir: ${{ env.SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**
