name: Deploy to Hostinger

# Auto-deploys the static site to Hostinger over SSH/rsync whenever code lands
# on `main` (production) or `staging`. No more manual Redeploy in hPanel.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SSH_HOST         Hostinger SSH host/IP   (Advanced -> SSH Access)
#   SSH_USER         Hostinger SSH username  (e.g. u123456789)
#   SSH_PORT         Hostinger SSH port      (usually 65002)
#   SSH_PRIVATE_KEY  Private key whose public half is added to Hostinger SSH Access
#
# Deploy targets are defined below. Adjust the staging path if Hostinger created
# the stag.isaacrothsolar.com subdomain in a different folder.

on:
  push:
    branches: [main, staging]

# Never let two deploys for the same branch run at once.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve deploy target
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            # Production document root.
            echo "path=public_html" >> "$GITHUB_OUTPUT"
          else
            # Staging subdomain (stag.isaacrothsolar.com) document root.
            echo "path=domains/stag.isaacrothsolar.com/public_html" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy with rsync
        run: |
          rsync -rltvz --human-readable \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.htaccess' \
            --exclude='.well-known' \
            -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ steps.target.outputs.path }}/"
