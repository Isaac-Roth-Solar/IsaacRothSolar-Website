name: Deploy to Hostinger

# Auto-deploys the static site to Hostinger over FTPS whenever code lands on
# `main` (production) or `staging`.
#
# Per-environment upload path (the two FTP accounts log in at different levels):
#   prod  (main)    -> FTP lands at account home  -> upload to "public_html/"
#   stage (staging) -> FTP lands at the web root   -> upload to "./"
#
# Always overwrites: a reset step deletes the action's sync-state before each
# deploy, so every run re-uploads ALL files. Uploads are additive (no mass
# delete), and .well-known is excluded so SSL is never disturbed.
#
# Required repository secrets:
#   Production: FTP_HOST_PROD     FTP_USERNAME_PROD     FTP_PASSWORD_PROD
#   Staging:    FTP_HOST_STAGING  FTP_USERNAME_STAGING  FTP_PASSWORD_STAGING

on:
  push:
    branches: [main, staging]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ github.ref_name == 'main' && secrets.FTP_HOST_PROD || secrets.FTP_HOST_STAGING }}
      FTP_USER: ${{ github.ref_name == 'main' && secrets.FTP_USERNAME_PROD || secrets.FTP_USERNAME_STAGING }}
      FTP_PASS: ${{ github.ref_name == 'main' && secrets.FTP_PASSWORD_PROD || secrets.FTP_PASSWORD_STAGING }}
      SERVER_DIR: ${{ github.ref_name == 'main' && 'public_html/' || './' }}
      STATE_PATH: ${{ github.ref_name == 'main' && 'public_html/.ftp-deploy-sync-state.json' || '.ftp-deploy-sync-state.json' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show FTP layout (diagnostic)
        run: |
          echo "Branch: ${{ github.ref_name }}  |  uploading to: $SERVER_DIR"
          echo "--- contents of FTP login directory ---"
          curl -s --ssl-reqd -k --connect-timeout 30 -u "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/" || true

      - name: Reset deploy state (force full overwrite)
        run: |
          # Clear the action's sync-state so every deploy re-uploads all files.
          curl --ssl-reqd -k --connect-timeout 30 \
            -u "$FTP_USER:$FTP_PASS" \
            -Q "DELE $STATE_PATH" \
            "ftp://$FTP_HOST/" || true

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ env.FTP_USER }}
          password: ${{ env.FTP_PASS }}
          protocol: ftps
          port: 21
          timeout: 600000
          local-dir: ./
          server-dir: ${{ env.SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**
